services:
  mysql:
    image: mysql:8.0
    container_name: ivory_service_db
    restart: always
    volumes:
      - ./db:/var/lib/mysql
    ports:
      - 7600:3306
    environment:
      MYSQL_DATABASE: IvoryDb
      MYSQL_ROOT_PASSWORD: 123456
    command: mysqld --character-set-server=utf8 --collation-server=utf8_unicode_ci --init-connect='SET NAMES UTF8;' --innodb-flush-log-at-trx-commit=0
    networks:
      - net
  redis:
    image: redis:alpine
    container_name: redis
    restart: always
    ports:
      - 9900:9900
    volumes:
      - ./redis:/data
    networks:
      - net

  gate-swag:
    build:
      context: ./gate
      dockerfile: Swag.Dockerfile
    volumes:
      - ./gate:/go/src
    container_name: gate-swag
    ports:
      - 7690:7690
    restart: no
    hostname: ivory_app
    networks:
      - net
    environment:
      DB_HOST: IvoryDb
    depends_on:
      - mysql
    working_dir: /go/src
    command: >
      bash -c "swag init -g cmd/server/main.go -o docs && go run ./cmd/server"

  nginx:
    image: nginx:latest
    container_name: ivory_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gate-swag
    networks:
      - net

volumes:
  db:
    driver: local
networks:
  net:
    driver: bridge
    name: net