server {
    listen 80;
    server_name _;

    # 用 Docker 內建 DNS，並延後解析到請求時
    resolver 127.0.0.11 ipv6=off valid=30s;

    set $backend http://gate-swag:7690;
    set $pprof   http://gate-swag:6060;

    # 健康檢查
    location = /nginx/health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Swagger：/swag/ -> /swagger/
    location /swag/ {
        proxy_pass $backend/swagger/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # pprof（走 Nginx 反代）
    location /debug/pprof/ {
        proxy_pass $pprof/debug/pprof/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 大輸出避免緩衝撐爆
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        send_timeout 300s;
    }
}

# http://localhost/	→ http://gate-swag:7690/
# http://localhost/api/x	→ http://gate-swag:7690/api/x
# http://localhost/swag/	→ http://gate-swag:7690/swagger/
# http://localhost/swag/index.html	→ http://gate-swag:7690/swagger/index.html