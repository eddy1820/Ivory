server {
    listen 80;
    server_name localhost;
    location / {
        proxy_pass http://gate-swag-debug:7690;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /swag/ {
        proxy_pass http://gate-swag-debug:7690/swagger/;
    }
}

# http://localhost/	→ http://gate-swag:7690/
# http://localhost/api/x	→ http://gate-swag:7690/api/x
# http://localhost/swag/	→ http://gate-swag:7690/swagger/
# http://localhost/swag/index.html	→ http://gate-swag:7690/swagger/index.html